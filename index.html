<script>
/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const round2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const fm=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const V=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const N=id=>+V(id)||0;
const sel=(v,x)=>v===x?'selected':'';
function dISO(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
const todayISO=()=>dISO(new Date());
const firstOfMonth=()=>todayISO().slice(0,8)+'01';
function nowStamp(){const d=new Date();return dISO(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return dISO(d)}
function addMonths(iso,n){const d=new Date(iso+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const e=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,e));return dISO(d)}
const monthEnd=iso=>{const d=new Date(iso+'T00:00:00');return dISO(new Date(d.getFullYear(),d.getMonth()+1,0))};
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function dayLabel(iso){const d=daysBetween(iso,todayISO());if(d===0)return t('dayToday');if(d===1)return t('dayYest');return iso}
function uid(p){return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click()}
function cycleMonths(c){return {monthly:1,quarterly:3,semi:6,yearly:12}[c]||1}
function currentPeriodStart(m,iso){const d=new Date(iso+'T00:00:00');return dISO(new Date(d.getFullYear(),d.getMonth()-(d.getMonth()%m),1))}

let S={user:null,page:'dashboard',filters:{},lang:'ar'};
let DB=null;
const DB_KEY='isp_db_v1';
const SESS_KEY='isp_sess';
const THEME_KEY='isp_theme';
let GRP={accounts:false,settings:false};
const isMobile=()=>window.innerWidth<=900;
let SIDE_OPEN=true;

/* وضع الشبكة: حفظ مزدوج (محلي + سيرفر) ومزامنة تلقائية كل 5 ثواني */
let SRV=false,SRV_REV=0,SRV_BUSY=false,SRV_DIRTY=0,SRV_BK=null;
async function srvSave(){if(SRV_BUSY)return;SRV_BUSY=true;
 try{const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});
 const j=await r.json();if(j&&j.rev)SRV_REV=j.rev;SRV_DIRTY=Date.now()}catch(e){}SRV_BUSY=false}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(DB));if(SRV){SRV_DIRTY=Date.now();srvSave()}}
async function srvSync(){if(!SRV||SRV_BUSY)return;if(Date.now()-SRV_DIRTY<8000)return;
 if($('#modal-root').innerHTML)return;
 const a=document.activeElement;if(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName))return;
 try{const r=await fetch('/api/db',{cache:'no-store'});const j=await r.json();
 if(j&&j.db&&j.rev!==SRV_REV){SRV_REV=j.rev;DB=j.db;
  if(S.user){const u=DB.users.find(x=>x.id===S.user.id);if(u)S.user=u;else{S.user=null;localStorage.removeItem(SESS_KEY)}}
  localStorage.setItem(DB_KEY,JSON.stringify(DB));render()}}catch(e){}}
setInterval(srvSync,5000);

function setSession(u){if(u)localStorage.setItem(SESS_KEY,u.id);else localStorage.removeItem(SESS_KEY)}
function persistPage(){try{sessionStorage.setItem('isp_view',JSON.stringify({page:S.page,filters:S.filters,grp:GRP}))}catch(e){}}
function loadDB(){try{const r=localStorage.getItem(DB_KEY);if(r){DB=JSON.parse(r);return}}catch(e){}DB=null;seed();save()}
/* تهيئة أولية نظيفة — بدون أي بيانات تجريبية */
function seed(){
 DB={users:[],packages:[],customers:[],invoices:[],payments:[],expenses:[],incomes:[],tickets:[],settings:{}};
 DB.settings={companyName:'NET',logo:'',address:'',phones:'',language:'ar',country:'+20',currency:'EGP',currencySymbol:'ج.م',taxRate:0,invSeq:0,lastBilling:''};
 DB.users=[{id:'u1',name:'admin',username:'admin',password:'123456',role:'manager',perms:[]}];
}
const t=k=>(T[S.lang]&&T[S.lang][k])||T.ar[k]||k;
const cur=()=>esc(DB.settings.currencySymbol||'');
const can=k=>{if(!S.user)return false;if(S.user.role==='manager')return true;return (S.user.perms||[]).includes(k)};
const EXP={lines:'eLines',elec:'eElec',maint:'eMaint',equip:'eEquip',rent:'eRent',sal:'eSal',trans:'eTrans',gov:'eGov',ads:'eAds',other:'eOther'};
const INC={connect:'iConnect',equip:'iEquipS',serv:'iServ',rent:'iRent',late:'iLate',other:'iOther'};
const roleL=r=>t({manager:'rManager',collector:'rCollector',support:'rSupport',custom:'rCustom'}[r]||r);
const custName=id=>{const c=DB.customers.find(x=>x.id===id);return c?c.name:null};
const pkgOf=c=>DB.packages.find(p=>p.id===c.packageId);
const custInvoices=c=>DB.invoices.filter(i=>i.customerId===c.id);
const custPayments=c=>DB.payments.filter(p=>p.customerId===c.id);
const custDue=c=>round2(custInvoices(c).reduce((s,i)=>s+(i.amount-(i.paidAmount||0)),0));
const lastPayDate=c=>{const p=custPayments(c).sort((a,b)=>b.date.localeCompare(a.date))[0];return p?p.date:''};
function oldestUnpaid(c){const invs=custInvoices(c).filter(i=>i.amount-(i.paidAmount||0)>0.009);if(!invs.length)return null;invs.sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date));return invs[0]}

 const inv={id:uid('i'),no:nextInvNo(),customerId:o.customerId||null,type:o.type||'manual',desc:o.desc||'',base,tax,amount:round2(base+tax),paidAmount:0,date:o.date||todayISO(),dueDate:o.dueDate||o.date||todayISO(),periodStart:o.periodStart||null,periodEnd:o.periodEnd||null,by:o.by||(S.user?S.user.name:'system'),createdAt:nowStamp()};

function calcPeriodEnd(pkg,startISO){const m=cycleMonths(pkg.cycle);const ms=startISO.slice(0,8)+'01';return monthEnd(addMonths(ms,m-1))}
function proRateAmount(pkg,startISO){const m=cycleMonths(pkg.cycle);const ps=startISO.slice(0,8)+'01';if(startISO<=ps)return round2(pkg.price*m);const end=calcPeriodEnd(pkg,startISO);const rem=daysBetween(startISO,end)+1;return round2(pkg.price*rem/30)}
function applyCredit(c){let cr=round2(c.credit||0);if(cr<=0)return;const invs=custInvoices(c).filter(i=>i.amount-(i.paidAmount||0)>0.009).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
 for(const i of invs){if(cr<=0.009)break;const need=round2(i.amount-(i.paidAmount||0));const x=round2(Math.min(need,cr));i.paidAmount=round2((i.paidAmount||0)+x);cr=round2(cr-x)}c.credit=cr}
function addPayment(custId,amount,date,method,notes){const c=DB.customers.find(x=>x.id===custId);if(!c)return null;let rest=round2(amount);
 const p={id:uid('y'),customerId:custId,amount:round2(amount),date,method,notes:notes||'',by:S.user?S.user.name:'system',alloc:[],createdAt:nowStamp()};
 const invs=custInvoices(c).filter(i=>i.amount-(i.paidAmount||0)>0.009).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
 for(const i of invs){if(rest<=0.009)break;const need=round2(i.amount-(i.paidAmount||0));const x=round2(Math.min(need,rest));i.paidAmount=round2((i.paidAmount||0)+x);rest=round2(rest-x);p.alloc.push({no:i.no,amt:x})}
 if(rest>0.009){c.credit=round2((c.credit||0)+rest);p.toCredit=rest}
 DB.payments.push(p);save();return p}

function runMonthlyBilling(silent,force){if(!DB)return;const t0=todayISO();const ym=t0.slice(0,7);
 if(!force&&DB.settings.lastBilling===ym){if(!silent)toast(t('billingDone')+' (0)');return}
 if(!force){const lock=+localStorage.getItem('isp_bl')||0;if(Date.now()-lock<45000&&DB.settings.lastBilling===ym)return;localStorage.setItem('isp_bl',String(Date.now()))}
 let n=0;for(const c of DB.customers){if(c.status!=='active')continue;const pkg=pkgOf(c);if(!pkg)continue;
  const ps=currentPeriodStart(cycleMonths(pkg.cycle),t0);
  if(custInvoices(c).some(i=>i.periodStart===ps))continue;
  createInvoice({customerId:c.id,type:'subscription',desc:pkg.name+' ('+pkg.speed+'Mbps) — '+ps+' → '+calcPeriodEnd(pkg,ps),base:round2(pkg.price*cycleMonths(pkg.cycle)),date:t0,dueDate:addDays(ps,+pkg.graceDays||0),periodStart:ps,periodEnd:calcPeriodEnd(pkg,ps)});
  applyCredit(c);n++}
 DB.settings.lastBilling=ym;save();if(!silent)toast(t('billingDone')+' ('+n+')')}

 [...DB.incomes].sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,L).forEach(x=>{ops.push({ts:x.createdAt||x.date,g1:'#15803d',g2:'#34d399',ic:'up',t1:t(INC[x.type]||'iOther'),t2:(x.description||'')+(x.by?' — '+x.by:''),am:fm(x.amount),sgn:'+',cls:'a-gr'})});
 [...DB.expenses].sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,L).forEach(x=>{ops.push({ts:x.createdAt||x.date,g1:'#b91c1c',g2:'#f87171',ic:'down',t1:t(EXP[x.type]||'eOther'),t2:(x.description||'')+(x.by?' — '+x.by:''),am:fm(x.amount),sgn:'-',cls:'a-rd'})});
 ops.sort((a,b)=>b.ts.localeCompare(a.ts));
 const top=ops.slice(0,L);if(!top.length)return `<div class="empty">${t('noData')}</div>`;
 let html='',lastD='';
 top.forEach(o=>{const d=o.ts.slice(0,10),tm=o.ts.length>10?o.ts.slice(11,16):'';
  if(d!==lastD){lastD=d;html+=`<div class="opd"><span>${dayLabel(d)}</span><span>${d}</span></div>`}

 return html}

function finCalc(){const from=S.filters.from||firstOfMonth(),to=S.filters.to||todayISO();const inP=d=>d>=from&&d<=to;
 const pays=DB.payments.filter(p=>inP(p.date));
 const subRev=round2(pays.reduce((s,p)=>s+p.amount,0));
 const manRev=round2(DB.invoices.filter(i=>!i.customerId&&inP(i.date)).reduce((s,i)=>s+(i.paidAmount||0),0));
 const othInc=round2(DB.incomes.filter(x=>inP(x.date)).reduce((s,x)=>s+x.amount,0));
 const totRev=round2(subRev+manRev+othInc);
 const exps=DB.expenses.filter(x=>inP(x.date));
 const totExp=round2(exps.reduce((s,x)=>s+x.amount,0));
 const billed=round2(DB.invoices.filter(i=>inP(i.date)).reduce((s,i)=>s+i.amount,0));
 const out=round2(DB.customers.reduce((s,c)=>s+custDue(c),0));
 const invCount=DB.invoices.filter(i=>inP(i.date)).length;
 const expBy={},incBy={},payBy={cash:0,transfer:0};
 exps.forEach(x=>expBy[x.type]=round2((expBy[x.type]||0)+x.amount));
 DB.incomes.filter(x=>inP(x.date)).forEach(x=>incBy[x.type]=round2((incBy[x.type]||0)+x.amount));
 pays.forEach(p=>payBy[p.method]=round2((payBy[p.method]||0)+p.amount));
 return{from,to,subRev,manRev,othInc,totRev,totExp,net:round2(totRev-totExp),billed,out,invCount,expBy,incBy,payBy}}

 const HMAP={'الاسم':'name','name':'name','الهاتف':'phone','phone':'phone','العنوان':'address','address':'address','الباقة':'pkg','package':'pkg','تاريخ البدء':'start','start':'start','نهاية الاشتراك':'end','end':'end','الحالة':'status','status':'status','مديونية سابقة':'debt','debt':'debt','رصيد دائن':'credit','credit':'credit','ملاحظات':'notes','notes':'notes'};

function parseCSV(txt){const rows=[];let row=[],curS='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){curS+='"';i++}else q=false}else curS+=ch}
  else{if(ch==='"')q=true;else if(ch===','){row.push(curS);curS=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(curS);curS='';if(row.some(c=>c!==''))rows.push(row);row=[]}
  else curS+=ch}}
 if(curS!==''||row.length){row.push(curS);if(row.some(c=>c!==''))rows.push(row)}return rows}

function tkFilt(k,v){S.filters[k]=v;$('#tk_rows').innerHTML=tkRows()}
function viewTickets(){if(!can('tickets'))return noAcc();
 const o=DB.tickets.filter(x=>x.status==='open').length,pr=DB.tickets.filter(x=>x.status==='prog').length,dn=DB.tickets.filter(x=>x.status==='done').length;
 return `<div class="stats">
 ${statCard('or','ticket',t('tOpen'),o)}${statCard('bl','ticket',t('tProg'),pr)}${statCard('gr','check',t('tDone'),dn)}</div>
 <div class="bar"><div class="h2">${t('tkT')}</div><button class="btn b-pu" onclick="openTkModal()">${I('plus')} ${t('addTk')}</button></div>
 <div class="fbar"><select onchange="tkFilt('st',this.value)"><option value="">${t('tkStat')}: ${t('all')}</option><option value="open" ${sel(S.filters.st,'open')}>${t('tOpen')}</option><option value="prog" ${sel(S.filters.st,'prog')}>${t('tProg')}</option><option value="done" ${sel(S.filters.st,'done')}>${t('tDone')}</option></select>
 <input placeholder="${t('search')}" value="${esc(S.filters.q||'')}" oninput="tkFilt('q',this.value)"></div>
 <div class="tw"><table><thead><tr><th>${t('serial')}</th><th>${t('tkTitle')}</th><th>${t('customer')}</th><th>${t('tkType')}</th><th>${t('prio')}</th><th>${t('assign')}</th><th>${t('dateF')}</th><th>${t('tkStat')}</th><th>${t('actions')}</th></tr></thead><tbody id="tk_rows">${tkRows()}</tbody></table></div>`}
function tkRows(){const st=S.filters.st||'',q=(S.filters.q||'').toLowerCase();
 let list=DB.tickets.filter(x=>(!st||x.status===st)&&(!q||x.title.toLowerCase().includes(q)||(custName(x.customerId)||'').toLowerCase().includes(q)));
 list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 if(!list.length)return emptyRow(9);
 const PB={high:'bg-r',med:'bg-y',low:'bg-mut'};
 return list.map((x,i)=>{const u=DB.users.find(v=>v.id===x.assign);
 return `<tr><td>${i+1}</td><td class="b">${esc(x.title)}</td><td>${esc(custName(x.customerId)||'-')}</td><td>${t(x.type||'tOther')}</td><td><span class="bg ${PB[x.prio]||'bg-mut'}">${t({high:'pHigh',med:'pMed',low:'pLow'}[x.prio]||'pLow')}</span></td><td>${u?esc(u.name):'-'}</td><td>${x.date||''}</td>
 <td><select style="width:auto;padding:4px 8px" onchange="setTk('${x.id}',this.value)"><option value="open" ${sel(x.status,'open')}>${t('tOpen')}</option><option value="prog" ${sel(x.status,'prog')}>${t('tProg')}</option><option value="done" ${sel(x.status,'done')}>${t('tDone')}</option></select></td>
 <td><div class="acts"><button class="icb" style="background:#d97706" onclick="openTkModal('${x.id}')">${I('edit',13)}</button><button class="icb" style="background:#dc2626" onclick="delTk('${x.id}')">${I('trash',13)}</button></div></td></tr>`}).join('')}
function setTk(id,v){const x=DB.tickets.find(y=>y.id===id);if(x){x.status=v;if(v==='done')x.closedAt=todayISO();save();$('#tk_rows').innerHTML=tkRows()}}
function delTk(id){if(!confirm(t('del')+'؟'))return;DB.tickets=DB.tickets.filter(x=>x.id!==id);save();toast(t('delOk'));render()}
function openTkModal(id){const x=id?DB.tickets.find(v=>v.id===id):null;
 openModal(x?t('edit'):t('addTk'),`<form onsubmit="saveTk(event)"><input type="hidden" id="t_id" value="${x?x.id:''}">
 <div class="fg"><label>${t('tkTitle')} *</label><input id="t_title" required value="${esc(x?x.title:'')}"></div>
 <div class="g2"><div class="fg"><label>${t('tkCust')}</label><select id="t_cust"><option value="">—</option>${DB.customers.map(c=>`<option value="${c.id}" ${x&&x.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="fg"><label>${t('tkType')}</label><select id="t_type">${['tVisit','tComplaint','tInstall','tOther'].map(k=>`<option value="${k}" ${x&&x.type===k?'selected':''}>${t(k)}</option>`).join('')}</select></div></div>
 <div class="g2"><div class="fg"><label>${t('prio')}</label><select id="t_prio"><option value="high" ${x&&x.prio==='high'?'selected':''}>${t('pHigh')}</option><option value="med" ${x&&x.prio==='med'?'selected':''}>${t('pMed')}</option><option value="low" ${x&&x.prio==='low'?'selected':''}>${t('pLow')}</option></select></div>
 <div class="fg"><label>${t('assign')}</label><select id="t_assign">${DB.users.map(u=>`<option value="${u.id}" ${x&&x.assign===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
 <div class="fg"><label>${t('descF')}</label><textarea id="t_desc" rows="2">${esc(x?x.desc||'':'')}</textarea></div>
 <div class="mrow"><button type="button" class="btn b-s" onclick="closeModal()">${t('back')}</button><button class="btn b-pu">${I('check',14)} ${t('save')}</button></div></form>`)}
function saveTk(e){e.preventDefault();const id=V('t_id'),title=V('t_title');if(!title){toast(t('req'),'err');return false}
 const o={title,customerId:V('t_cust')||null,type:V('t_type'),prio:V('t_prio'),assign:V('t_assign'),desc:V('t_desc')};
 if(id)Object.assign(DB.tickets.find(v=>v.id===id),o);else DB.tickets.push({id:uid('k'),...o,status:'open',date:todayISO()});
 save();closeModal();toast(t('savedOk'));render();return false}

/* ============ Settings ============ */
const CC=['+20','+966','+971','+962','+973','+968','+974','+964','+213','+212','+216','+218','+249','+90'];
const PERMS=[['dashboard','dashboard'],['customers','customers'],['packages','packages'],['invoices','invoices'],['payments','payments'],['expenses','expenses'],['incomes','incomes'],['reports','reports'],['tickets','tickets'],['settings','settings']];
const DEFAULT_PERMS={collector:['dashboard','payments'],support:['dashboard','tickets','invoices','expenses','incomes']};
function viewSettings(){if(!can('settings'))return noAcc();const tab=S.filters.tab||'general';
 return `<div class="tabs"><button class="tab ${tab==='general'?'on':''}" onclick="go('settings',{tab:'general'})">${t('general')}</button>
 <button class="tab ${tab==='users'?'on':''}" onclick="go('settings',{tab:'users'})">${t('usersM')}</button>
 <button class="tab ${tab==='backup'?'on':''}" onclick="go('settings',{tab:'backup'})">${t('backup')}</button></div>
 ${tab==='users'?tabUsers():tab==='backup'?tabBackup():tabGeneral()}`}
function tabGeneral(){const st=DB.settings;
 return `<form onsubmit="saveSettings(event)" style="background:var(--card);border:1px solid var(--br);border-radius:var(--rad);padding:16px;box-shadow:var(--sh);max-width:760px">
 <h3 class="h3">${t('compInfo')}</h3>
 <div class="g2"><div class="fg"><label>${t('cname')}</label><input id="s_name" value="${esc(st.companyName)}"></div>
 <div class="fg"><label>${t('contacts')}</label><input id="s_phones" value="${esc(st.phones)}"></div></div>
 <div class="fg"><label>${t('addressF')}</label><input id="s_addr" value="${esc(st.address)}"></div>
 <div class="fg"><label>${t('logoF')}</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span id="logo_prev">${logoHTML(48)}</span><input type="file" accept="image/*" style="width:auto" onchange="logoPick(this)"><button type="button" class="btn b-s" onclick="logoClear()">${t('del')}</button></div><input type="hidden" id="s_logo" value="${esc(st.logo||'')}"></div>
 <h3 class="h3">${t('general')}</h3>
 <div class="g2"><div class="fg"><label>${t('defLang')}</label><select id="s_lang"><option value="ar" ${sel(st.language,'ar')}>العربية</option><option value="en" ${sel(st.language,'en')}>English</option></select></div>
 <div class="fg"><label>${t('country')}</label><select id="s_cc">${CC.map(c=>`<option value="${c}" ${sel(st.country,c)}>${c}</option>`).join('')}</select></div></div>
 <div class="g2"><div class="fg"><label>${t('currencyF')}</label><input id="s_cur" value="${esc(st.currency)}"></div>
 <div class="fg"><label>${t('currSym')}</label><input id="s_sym" value="${esc(st.currencySymbol)}"></div></div>
 <div class="fg"><label>${t('taxR')}</label><input type="number" step="0.5" min="0" id="s_tax" value="${+st.taxRate||0}" style="max-width:160px"></div>
 <button class="btn b-p">${I('check',14)} ${t('saveSet')}</button></form>`}
function logoPick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{$('#s_logo').value=e.target.result;$('#logo_prev').innerHTML=`<img src="${e.target.result}" style="width:48px;height:48px;object-fit:contain;border-radius:12px">`};
 r.readAsDataURL(f)}
function logoClear(){$('#s_logo').value='';$('#logo_prev').innerHTML=logoHTML(48)}
function saveSettings(e){e.preventDefault();const st=DB.settings;
 st.companyName=V('s_name')||st.companyName;st.phones=V('s_phones');st.address=V('s_addr');st.logo=V('s_logo');
 st.language=V('s_lang');st.country=V('s_cc');st.currency=V('s_cur');st.currencySymbol=V('s_sym');st.taxRate=N('s_tax');
 S.lang=st.language;save();toast(t('savedOk'));render();return false}
function tabUsers(){return `<div class="bar"><div class="h2">${t('usersM')}</div><button class="btn b-p" onclick="userModal()">${I('plus')} ${t('addUser')}</button></div>
 <div class="tw"><table><thead><tr><th>${t('uName')}</th><th>${t('user')}</th><th>${t('role')}</th><th>${t('perms')}</th><th>${t('actions')}</th></tr></thead><tbody>
 ${DB.users.map(u=>`<tr><td class="b">${esc(u.name)}</td><td>${esc(u.username)}</td><td><span class="bg ${u.role==='manager'?'bg-b':u.role==='collector'?'bg-g2':'bg-mut'}">${roleL(u.role)}</span></td><td class="nt">${u.role==='manager'?'*':(u.perms||[]).join(', ')||'-'}</td><td><div class="acts">
 <button class="icb" style="background:#d97706" onclick="userModal('${u.id}')">${I('edit',13)}</button>
 <button class="icb" style="background:#dc2626" onclick="delUser('${u.id}')">${I('trash',13)}</button></div></td></tr>`).join('')||emptyRow(5)}</tbody></table></div>`}
function userModal(id){const u=id?DB.users.find(x=>x.id===id):null;
 openModal(u?t('edit'):t('addUser'),`<form onsubmit="saveUser(event)"><input type="hidden" id="u_id" value="${u?u.id:''}">
 <div class="g2"><div class="fg"><label>${t('uName')} *</label><input id="u_name" required value="${esc(u?u.name:'')}"></div>
 <div class="fg"><label>${t('user')} *</label><input id="u_username" required value="${esc(u?u.username:'')}"></div></div>
 <div class="g2"><div class="fg"><label>${t('passW')} ${u?'':'*'}</label><input id="u_pass" type="password" ${u?'':'required'}></div>
 <div class="fg"><label>${t('role')}</label><select id="u_role" onchange="permTgl()"><option value="manager" ${u&&u.role==='manager'?'selected':''}>${t('rManager')}</option><option value="collector" ${u&&u.role==='collector'?'selected':''}>${t('rCollector')}</option><option value="support" ${u&&u.role==='support'?'selected':''}>${t('rSupport')}</option><option value="custom" ${u&&u.role==='custom'?'selected':''}>${t('rCustom')}</option></select></div></div>
 <div id="u_perms" style="display:${u&&u.role==='custom'?'block':'none'};border:1px solid var(--br);border-radius:12px;padding:10px 14px;margin-bottom:12px"><label>${t('perms')}</label>
 ${PERMS.map(p=>`<label class="ck"><input type="checkbox" class="pc" value="${p[0]}" ${u&&u.role==='custom'&&(u.perms||[]).includes(p[0])?'checked':''}>${t(p[1])}</label>`).join('')}</div>
 <div class="mrow"><button type="button" class="btn b-s" onclick="closeModal()">${t('back')}</button><button class="btn b-p">${I('check',14)} ${t('save')}</button></div></form>`)}
function permTgl(){$('#u_perms').style.display=V('u_role')==='custom'?'block':'none'}
function saveUser(e){e.preventDefault();const id=V('u_id'),name=V('u_name'),username=V('u_username'),pass=V('u_pass'),role=V('u_role');
 if(!name||!username||(!id&&!pass)){toast(t('req'),'err');return false}
 if(DB.users.some(u=>u.username===username&&u.id!==id)){toast(t('badLogin'),'err');return false}
 let perms=role==='custom'?[...document.querySelectorAll('.pc:checked')].map(x=>x.value):null;
 if(id){const u=DB.users.find(x=>x.id===id);if(!u)return false;Object.assign(u,{name,username,role});
  if(pass)u.password=pass;
  if(perms)u.perms=perms;else if(role!=='custom')u.perms=DEFAULT_PERMS[role]||[];
  if(S.user.id===id)S.user=u}
 else DB.users.push({id:uid('u'),name,username,password:pass,role,perms:role==='custom'?perms:(DEFAULT_PERMS[role]||[])});
 save();closeModal();toast(t('savedOk'));render();return false}
function delUser(id){if(id===S.user.id){toast(t('noAcc'),'err');return false}
 const u=DB.users.find(x=>x.id===id);if(!u)return;
 if(u.role==='manager'&&DB.users.filter(x=>x.role==='manager').length<=1){toast(t('noAcc'),'err');return false}
 if(!confirm(t('del')+'؟'))return;DB.users=DB.users.filter(x=>x.id!==id);save();toast(t('delOk'));render()}
/* === النسخ الاحتياطي (سيرفر + محلي) === */
async function srvBackups(){try{const r=await fetch('/api/backups',{cache:'no-store'});return await r.json()}catch(e){return []}}
function refreshSrvBk(){if(!SRV)return;srvBackups().then(l=>{SRV_BK=l||[];const el=$('#srv_bk');if(el)el.innerHTML=srvBkRows()}).catch(()=>{})}
function srvBkRows(){if(SRV_BK===null)return `<tr><td colspan="3" class="empty">...</td></tr>`;
 if(!SRV_BK.length)return emptyRow(3);
 return SRV_BK.map(f=>`<tr><td class="b">${esc(f)}</td><td><a class="btn b-s" style="padding:5px 10px;font-size:12px" href="/api/backup/${encodeURIComponent(f)}" download>${I('download',13)} ${t('exportC')}</a></td><td><button class="btn b-te" style="padding:5px 10px;font-size:12px" onclick="srvRestore('${esc(f)}')">${I('db',13)} ${t('restore')}</button></td></tr>`).join('')}
async function srvRestore(f){if(!f)return;if(!confirm(t('restoreC')))return;
 try{const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:f})});
 const j=await r.json();
 if(j&&j.ok){const d=await fetch('/api/db',{cache:'no-store'}).then(x=>x.json());DB=d.db;SRV_REV=d.rev||0;save();
  S.user=DB.users.find(u=>u.id===(S.user&&S.user.id))||null;if(!S.user)setSession(null);
  S.lang=DB.settings.language||'ar';render();toast(t('restored'))}else toast('Error','err')}catch(e){toast('Error','err')}}
function tabBackup(){const autos=Object.keys(localStorage).filter(k=>k.startsWith('isp_ab_')).sort().reverse();
 setTimeout(refreshSrvBk,0);
 return `<div class="cards2" style="margin-bottom:14px">
 <div class="ibox"><div class="il">${t('lastB')}</div><div class="iv">${DB.settings.lastBilling||'-'}</div><button class="btn b-te" style="margin-top:10px" onclick="runMonthlyBilling(false,true)">${I('check',14)} ${t('runB')}</button><div class="note" style="margin:10px 0 0">${t('autoBNote')}</div></div>
 <div class="ibox"><div class="il">${t('backupNow')}</div><button class="btn b-bl" style="margin-top:10px" onclick="backupNow()">${I('download',14)} JSON</button></div>
 <div class="ibox"><div class="il">${t('restoreB')}</div><input type="file" accept=".json,application/json" style="margin-top:10px" onchange="restoreFile(this)"></div></div>
 ${SRV?`<h3 class="h3">${t('srvBk')}</h3><div class="tw"><table style="min-width:420px"><thead><tr><th>${t('dateF')}</th><th>${t('exportC')}</th><th>${t('restore')}</th></tr></thead><tbody id="srv_bk">${srvBkRows()}</tbody></table></div>`:''}
 <h3 class="h3">${t('locBk')}</h3>
 <div class="tw"><table style="min-width:400px"><thead><tr><th>${t('dateF')}</th><th></th></tr></thead><tbody>
 ${autos.length?autos.map(k=>`<tr><td class="b">${k.slice(7)}</td><td><button class="btn b-s" onclick="restoreAuto('${k}')">${I('db',13)} ${t('restore')}</button></td></tr>`).join(''):emptyRow(2)}</tbody></table></div>`}
function backupNow(){download('isp_backup_'+todayISO()+'.json',JSON.stringify(DB,null,1),'application/json');toast(t('backedUp'))}
function restoreFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.customers||!d.settings)throw 0;
  if(!confirm(t('restoreC')))return;DB=d;save();S.lang=DB.settings.language||'ar';S.user=DB.users.find(u=>u.id===(S.user&&S.user.id))||null;if(!S.user)setSession(null);render();toast(t('restored'))}catch(err){toast('JSON Error','err')}};
 r.readAsText(f)}
function restoreAuto(k){if(!confirm(t('restoreC')))return;try{DB=JSON.parse(localStorage.getItem(k));save();S.lang=DB.settings.language||'ar';render();toast(t('restored'))}catch(e){toast('Error','err')}}

/* ============ Pull to refresh ============ */
(function(){let y0=0,pulling=false,dist=0;const P=()=>document.getElementById('ptr');
 document.addEventListener('touchstart',e=>{if((document.documentElement.scrollTop||document.body.scrollTop)>0)return;if($('#modal-root')&&$('#modal-root').innerHTML)return;y0=e.touches[0].clientY;pulling=true;dist=0},{passive:true});
 document.addEventListener('touchmove',e=>{if(!pulling)return;const d=e.touches[0].clientY-y0;
  if(d>0&&(document.documentElement.scrollTop||document.body.scrollTop)<=0){dist=Math.min(d*0.5,90);const p=P();if(p){p.style.top=(dist-40)+'px'}}},{passive:true});
 document.addEventListener('touchend',()=>{if(!pulling)return;pulling=false;const p=P();if(!p)return;
  if(dist>60){p.classList.add('spin');p.style.top='10px';setTimeout(()=>location.reload(),350)}
  else{p.style.top=''}})})();

/* ============ Init ============ */
(async function init(){
 applyTheme(localStorage.getItem(THEME_KEY)||'light');
 try{const r=await fetch('/api/db',{cache:'no-store'});
  if(r.ok){const j=await r.json();SRV=true;if(j.db){DB=j.db;SRV_REV=j.rev||0}else DB=null}}
 catch(e){}
 if(!DB)loadDB();
 /* استعادة الجلسة بعد التحديث */
 const sid=localStorage.getItem(SESS_KEY);
 if(sid){const u=DB.users.find(x=>x.id===sid);if(u)S.user=u;else localStorage.removeItem(SESS_KEY)}
 /* استعادة الصفحة والفلاتر بعد التحديث */
 if(S.user){try{const v=JSON.parse(sessionStorage.getItem('isp_view')||'null');
  if(v){S.page=v.page||S.page;S.filters=v.filters||{};Object.assign(GRP,v.grp||{})}}catch(e){}}
 if(SRV)save();
 SIDE_OPEN=!isMobile();
 runMonthlyBilling(true);
 S.lang=DB.settings.language||'ar';render();
 applySide();
 setInterval(()=>runMonthlyBilling(true),30*60*1000);
})();
</script>
